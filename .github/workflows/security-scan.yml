# This file lives in ai_code_auditor itself, so it consumes its OWN
# action.yml via a relative path (uses: ./) instead of the public
# "maorVakn/ai_code_auditor@v1" reference that external repos use.
# This is how the project tests itself on every push/PR (dogfooding).

name: Security scan

on:
  push:
    branches-ignore: [gh-pages]   # run on every branch except the one the reports live on
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button with a branch picker

permissions:
  contents: write        # needed so this repo's own run can publish to gh-pages
  pull-requests: write    # needed for the PR comment with the report link

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}